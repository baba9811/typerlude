[[items]]
id = "ko-text-retelling-sun-moon-siblings"
kind = "text"
title = "하늘에 남은 두 빛 — 해와 달이 된 오누이 다시 쓰기"
difficulty = 2
tags = ["retelling"]
text = """산마을의 오누이는 장에 간 어머니를 기다리고 있었다. 밤이 깊었을 때 문밖에서 어머니를 흉내 내는 목소리가 들렸다. 그러나 문틈으로 보인 그림자는 사람보다 크고 손에는 거친 털이 가득했다. 오누이는 호랑이가 왔음을 알아차리고 뒤뜰의 높은 나무로 달아났다.

호랑이가 나무를 오르기 시작하자 오누이는 하늘을 향해 살려 달라고 외쳤다. 구름 사이에서 튼튼한 줄 하나가 내려왔고, 두 아이는 서로를 밀어 주며 올라갔다. 뒤따르던 호랑이 앞에는 삭은 줄이 떨어졌다. 줄은 무게를 견디지 못했고 호랑이는 땅으로 떨어져 다시 아이들을 쫓지 못했다.

하늘에 닿은 오누이는 세상을 비출 일을 맡았다. 처음에는 동생이 밤을 두려워했으나 누이가 곁에서 지켜 주겠다고 약속하자 서로의 자리를 정할 수 있었다. 한 아이는 낮을 밝히는 해가 되고 다른 아이는 어둠을 살피는 달이 되었다. 두 빛은 번갈아 산마을의 지붕과 숲길을 비추었다."""
