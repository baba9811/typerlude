[[items]]
id = "ko-text-retelling-heungbu-nolbu"
kind = "text"
title = "박씨 하나의 몫 — 흥부와 놀부 다시 쓰기"
difficulty = 3
tags = ["retelling"]
text = """한마을에 성품이 다른 형제가 살았다. 형 놀부는 넉넉한 살림을 혼자 지키려 했고, 동생 흥부는 어려운 형편에도 이웃과 일을 나누었다. 어느 봄날 흥부는 처마 밑에서 다친 제비를 발견했다. 그는 부러진 다리를 가볍게 받쳐 주고 날개에 힘이 돌아올 때까지 안전한 곳에서 보살폈다.

이듬해 봄, 제비가 가져온 박씨를 심었다. 여름이 되자 지붕 위로 큼직한 박이 열렸다. 흥부 가족이 박을 타니 먹을거리와 살림에 필요한 물건이 나왔다. 소문을 들은 놀부는 같은 행운을 억지로 만들려고 멀쩡한 제비를 다치게 한 뒤 치료하는 시늉을 했다. 이듬해 그의 박에서는 쓸모없는 소동만 쏟아져 나와 쌓아 둔 재물과 집 안을 어지럽혔다.

흥부는 형의 실패를 비웃지 않고 사람들을 불러 함께 집을 정돈했다. 놀부는 자신이 얻으려 한 것이 보상이 아니라 남의 몫이었다는 사실을 뒤늦게 깨달았다. 그는 동생에게 사과하고 창고를 열어 마을과 곡식을 나누었다. 두 형제의 형편은 하루아침에 같아지지 않았지만, 그날부터 도움을 주고받는 문은 닫히지 않았다."""
