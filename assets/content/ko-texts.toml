[[items]]
id = "ko-text-essay-room-to-revise"
kind = "text"
title = "고칠 자리를 남기는 일"
difficulty = 2
tags = ["essay"]
text = """처음부터 완벽한 문장을 만들겠다고 마음먹으면 손이 자주 멈춘다. 생각은 아직 자라는 중인데 이미 끝난 모양을 요구하기 때문이다. 나는 초안에서 모르는 낱말에 동그라미를 치고, 이어지지 않는 문장 사이에는 한 줄을 비워 둔다.

고칠 자리를 남겨 둔 글은 실패한 글이 아니다. 다음 생각이 들어올 문이 있는 글이다. 한 번 쉬었다 돌아오면 불필요한 말은 덜어 내고, 흐린 부분에는 구체적인 장면을 보탤 수 있다. 수정은 처음의 부족함을 숨기는 일이 아니라 생각이 제 모양을 찾도록 돕는 과정이다."""
