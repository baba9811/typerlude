[[items]]
id = "ko-text-fiction-blue-umbrella"
kind = "text"
title = "파란 우산의 행선지"
difficulty = 2
tags = ["fiction"]
text = """비가 그친 저녁, 민서는 우체국 대기 의자 밑에서 파란 우산을 발견했다. 손잡이에는 흰 실이 여러 번 감겨 있었고, 안쪽 천 한 칸에는 작은 반달 모양의 덧댐이 보였다. 민서는 우산을 말린 뒤 분실물 표에 특징을 적어 두었다.

다음 날 한 아이가 찾아와 할머니의 우산 같다고 말했다. 민서는 바로 건네지 않고 할머니와 함께 다시 오라고 부탁했다. 오후에 온 할머니는 손잡이의 실을 직접 감았고, 반달 덧댐 아래에는 보이지 않는 초록색 바늘땀이 있다고 설명했다. 확인해 보니 말한 그대로였다.

할머니는 우산을 펼쳐 살피고는 아이에게 손잡이를 맡겼다. 두 사람은 좁은 우산 아래 나란히 서서 우체국을 나섰다. 민서는 분실물 표에 돌려준 시각을 적고 창밖을 보았다. 맑아진 골목 끝에서 파란 원 하나가 천천히 멀어지고 있었다."""
