[[items]]
id = "ko-text-fiction-last-seed"
kind = "text"
title = "마지막 씨앗 봉투"
difficulty = 2
tags = ["fiction"]
text = """마을 텃밭의 봄 준비가 끝날 무렵, 서랍 뒤에서 누런 씨앗 봉투 하나가 나왔다. 이름표는 없고 연필로 ‘첫 비가 온 뒤’라고만 적혀 있었다. 관리인 수현은 씨앗을 모두 밭에 뿌리는 대신 몇 알을 작은 화분에 심고 날짜를 붙였다.

첫 비가 지나자 가느다란 싹 세 개가 올라왔다. 잎 모양을 본 이웃들은 저마다 다른 꽃 이름을 말했지만, 수현은 꽃이 필 때까지 기다리기로 했다. 물을 너무 많이 주지 않고, 아침마다 키와 잎 수를 기록했다.

초여름에 주황빛 꽃이 피자 오래전 텃밭을 돌보던 사람이 금잔화라고 알려 주었다. 그는 씨앗을 받은 날을 기억했지만 봉투에 이름 쓰는 일은 잊었다며 웃었다. 가을이 되자 수현은 새 씨앗을 받아 품종과 날짜를 또렷이 적었다. 마지막 봉투는 그렇게 다음 봉투들의 시작이 되었다."""
