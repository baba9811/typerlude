[[items]]
id = "ko-text-constitution-articles-1-5"
kind = "text"
title = "대한민국헌법 제1조부터 제5조"
difficulty = 3
tags = ["public-domain"]
text = """제1조 (1) 대한민국은 민주공화국이다.
(2) 대한민국의 주권은 국민에게 있고, 모든 권력은 국민으로부터 나온다.
제2조 (1) 대한민국의 국민이 되는 요건은 법률로 정한다.
(2) 국가는 법률이 정하는 바에 의하여 재외국민을 보호할 의무를 진다.
제3조 대한민국의 영토는 한반도와 그 부속도서로 한다.
제4조 대한민국은 통일을 지향하며, 자유민주적 기본질서에 입각한 평화적 통일정책을 수립하고 이를 추진한다.
제5조 (1) 대한민국은 국제평화의 유지에 노력하고 침략적 전쟁을 부인한다.
(2) 국군은 국가의 안전보장과 국토방위의 신성한 의무를 수행함을 사명으로 하며, 그 정치적 중립성은 준수된다."""
