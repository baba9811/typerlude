[[items]]
id = "ko-text-poem-when-that-day-comes"
kind = "text"
title = "그날이 오면"
difficulty = 3
tags = ["classic"]
text = """그날이 오면, 그날이 오며는
삼각산이 일어나 더덩실 춤이라도 추고
한강물이 뒤집혀 용솟음칠 그날이
이 목숨이 끊치기 전에 와 주기만 하량이면
나는 밤하늘에 날으는 까마귀와 같이
종로의 인경을 머리로 들이받아 올리오리다.
두 개골은 깨어져 산산조각이 나도
기뻐서 죽사오매 오히려 무슨 한이 남으오리까.
그날이 와서, 오오 그날이 와서
육조 앞 넓은 길을 울며 뛰며 딩굴어도
그래도 넘치는 기쁨에 가슴이 미어질 듯 하거던
드는 칼로 이 몸의 가죽이라도 벗겨서
커다란 북을 만들어 들쳐 메고는
여러분의 행렬에 앞장을 서오리다.
우렁찬 그 소리를 한 번이라도 듣기만 하면
그 자리에 거꾸러져도 눈을 감겠소."""
