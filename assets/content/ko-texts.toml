[[items]]
id = "ko-text-essay-window-routine"
kind = "text"
title = "창문을 닦는 순서"
difficulty = 2
tags = ["essay"]
text = """창문을 닦는 날에는 유리부터 문지르기 쉽지만, 먼저 창틀의 먼지를 걷어 내는 편이 낫다. 마른 솔로 모서리를 쓸고 젖은 천으로 틀을 닦은 뒤에야 유리에 맑은 길이 생긴다. 순서를 바꾸면 방금 닦은 면에 먼지 섞인 물이 다시 흐른다.

작은 집안일에도 앞뒤가 있다. 필요한 도구를 한곳에 모으고, 위에서 아래로 움직이고, 마지막에는 마른 천으로 물기를 확인한다. 이런 순서는 서두르기 위한 요령이 아니라 같은 일을 되풀이하지 않게 하는 약속이다.

깨끗해진 창은 대단한 변화를 만들지 않는다. 다만 바깥의 나뭇가지와 건너편 지붕이 전보다 또렷하게 보인다. 손을 쓴 결과가 바로 드러나는 일은 복잡한 하루에 조용한 마침표를 찍어 준다."""
