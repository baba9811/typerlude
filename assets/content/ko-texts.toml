[[items]]
id = "ko-text-aphorism-daily-bearings"
kind = "text"
title = "생활의 작은 방위표"
difficulty = 2
tags = ["aphorism"]
text = """빠른 대답이 늘 친절한 것은 아니다. 잠시 생각한 뒤 건네는 정확한 말이 상대의 시간을 더 아껴 준다.

우산을 접기 전에 빗물을 한 번 털어 내면 다음 사람의 바닥이 덜 미끄럽다. 사소한 마무리는 나보다 늦게 도착할 사람을 배려하는 방식이다.

계획은 미래를 맞히는 문서가 아니다. 사정이 달라졌을 때 무엇부터 바꿀지 알려 주는 지도다.

익숙한 길에서도 표지판을 보는 사람은 길을 의심하는 것이 아니다. 자신이 아는 것과 지금 보이는 것을 함께 확인하는 것이다.

도움은 큰 결심보다 구체적인 질문에서 시작된다. 무엇이 필요한지 물으면 선의가 쓸모 있는 행동으로 바뀐다.

끝까지 해낸 일만 기록할 필요는 없다. 멈춘 이유를 적어 두면 다음 시작은 같은 자리에서 헤매지 않는다."""
