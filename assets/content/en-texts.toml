[[items]]
id = "en-text-retelling-tortoise-hare"
kind = "text"
title = "Two Ways to the Finish — The Tortoise and the Hare Retold"
difficulty = 2
tags = ["retelling"]
text = """A hare liked to circle the meadow at sunrise, scattering dew with every stride. One morning he laughed at a tortoise who was crossing the same field one careful step at a time. The tortoise pointed to a fig tree on the far ridge and suggested that they both travel there. The hare agreed before the last word was spoken.

He reached the lower hill quickly and looked back. The tortoise was a small mark beside the grass, so the hare stopped to eat clover in the shade. Certain that he could recover any lead, he stretched out and fell asleep. The tortoise kept moving, resting only long enough to choose firm ground around stones and roots.

When the hare woke, the shadow of the fig tree had lengthened. He raced uphill and found the tortoise already beside the trunk, catching his breath. The hare had spent less time running, but he had treated the journey as if only his fastest moment mattered. On the walk home, he matched the tortoise's pace and listened when his companion described the safer path through the grass."""
