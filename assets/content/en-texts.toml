[[items]]
id = "en-text-fiction-upper-window"
kind = "text"
title = "The Light in the Upper Window"
difficulty = 2
tags = ["fiction"]
text = """For a week, a warm square of light appeared in the upper window of the old station hall. The building had been quiet since the ticket office moved across the tracks. Mara passed it on her evening bicycle route and wondered who climbed the narrow stairs after dark.

On Friday, she delivered a parcel addressed to the hall's new workshop. The caretaker led her upstairs, where six neighbors were repairing paper lanterns from the town's winter parade. Bent frames lay beside pots of paste, and faded blue paper covered the long table. The mysterious light came from an ordinary work lamp aimed at the smallest tears.

Mara stayed to hold a frame while the caretaker tied a new crosspiece. By closing time, one lantern was ready for testing. They lowered it in front of the upper window and switched on its tiny bulb. From the street, the square of light now held a blue star. The next evening, Mara returned without a parcel and brought her own scissors."""
