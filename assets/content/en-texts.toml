[[items]]
id = "en-text-aphorism-steady-compass"
kind = "text"
title = "A Steady Compass"
difficulty = 2
tags = ["aphorism"]
text = """A checklist earns its place when it remembers the dull step that confidence skips. A useful routine protects attention without asking for applause.

When instructions fail, record the point where the reader had to guess. One precise example can shorten a disagreement that ten broad claims would prolong.

A repaired handle teaches more about a tool than a polished label. Leave the last five minutes of a task for the person who must use its result.

A quiet correction travels farther than a loud excuse. If a plan survives only in memory, it changes a little each time someone defends it."""
