[[items]]
id = "en-text-fiction-paper-bridge"
kind = "text"
title = "The Paper Bridge"
difficulty = 2
tags = ["fiction"]
text = """Noor was building a paper model of the river district for the local history room. The houses stood neatly, but the narrow bridge kept sagging between its cardboard banks. A flat strip looked accurate from above and collapsed whenever she moved the model.

During lunch, a young visitor watched Noor start again. He folded a scrap into a row of small ridges and set it across two books. The shape was too plain for the finished model, but it held a stack of coins. Noor copied the idea inside a second strip, hiding the folds beneath a smooth paper surface. This time the bridge kept its line when she lifted the base.

At the exhibit opening, the visitor found his experiment displayed beside the model. A label explained that the paper folds were only a test, not a plan for a real bridge. Engineers would need measurements, materials, and safety checks. He read the label twice, then placed one coin on the demonstration strip. The little bridge held, and Noor handed him a second coin."""
