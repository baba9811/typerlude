[[items]]
id = "en-text-retelling-stone-soup"
kind = "text"
title = "The Empty Pot — Stone Soup Retold"
difficulty = 2
tags = ["retelling"]
text = """A traveling pot-mender reached a village after the market had closed. At each door, people apologized that their cupboards were too bare to feed a stranger. In the square, she filled her copper pot from the well, washed a smooth road stone, and announced that it would make an excellent broth.

Curious neighbors gathered while the water warmed. The mender tasted it and said the stone was promising, though one onion would give it a rounder flavor. Someone brought an onion. Another person offered two carrots, and a third returned with a handful of barley. Soon a gardener added herbs that would have wilted by morning.

The stone remained at the bottom while the village shared the soup. No single gift had been enough for a meal, but none had been too small for the pot. Before leaving, the mender set the clean stone beside the well. The villagers kept no recipe for stone broth; instead, they began a chalkboard where anyone could list what was available to share."""
