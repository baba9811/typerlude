name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vMAJOR.MINOR.PATCH tag to resume
        required: true
        type: string

permissions:
  contents: read

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install Rust 1.88.0 and policy tools
        run: |
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt --component clippy
          rustup default 1.88.0
          cargo +1.88.0 install cargo-deny --version 0.20.2 --locked
      - name: Validate tag and ancestry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "release tag must be vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG")"
          jq -e '.object.type == "tag"' <<< "$tag_ref" > /dev/null || {
            echo "release tag must be an annotated tag" >&2
            exit 1
          }
          tag_object_sha="$(jq -er '.object.sha | select(type == "string" and length > 0)' <<< "$tag_ref")"
          tag_object="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_object_sha")"
          jq -e '.object.type == "commit" and .verification.verified == true' \
            <<< "$tag_object" > /dev/null || {
            echo "release tag must be verified and point directly to a commit" >&2
            exit 1
          }
          tag_commit="$(jq -er '.object.sha | select(type == "string" and length > 0)' <<< "$tag_object")"
          test "$tag_commit" = "$(git rev-parse "$RELEASE_TAG^{}")" || {
            echo "GitHub tag target does not match the checked-out tag" >&2
            exit 1
          }
          git fetch --no-tags origin '+refs/heads/main:refs/remotes/origin/main'
          git merge-base --is-ancestor "$tag_commit" origin/main || {
            echo "tag commit is not reachable from origin/main" >&2
            exit 1
          }
          node scripts/check-versions.mjs "$RELEASE_TAG"
      - name: Test
        run: make test
      - name: Verify Cargo package
        run: cargo publish --dry-run --locked
      - name: Verify installable host package
        run: node scripts/verify-package.mjs

  build:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            package: typerlude-darwin-x64
            executable: typerlude
            archive_extension: tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            package: typerlude-darwin-arm64
            executable: typerlude
            archive_extension: tar.gz
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            package: typerlude-linux-x64
            executable: typerlude
            archive_extension: tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            package: typerlude-linux-arm64
            executable: typerlude
            archive_extension: tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            package: typerlude-win32-x64-msvc
            executable: typerlude.exe
            archive_extension: zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            package: typerlude-win32-arm64-msvc
            executable: typerlude.exe
            archive_extension: zip
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - name: Install Rust 1.88.0 and target
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup target add --toolchain 1.88.0 ${{ matrix.target }}
      - name: Install musl linker
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends musl-tools
      - name: Build native binary
        run: cargo +1.88.0 build --release --locked --target ${{ matrix.target }}
      - name: Smoke, pack, and archive Unix binary
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          set -euo pipefail
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          binary="$GITHUB_WORKSPACE/target/$TARGET/release/$EXECUTABLE"
          export TYPERLUDE_HOME="$temporary/direct-home"
          export TYPERLUDE_NO_UPDATE_CHECK=1
          "$binary" --version
          "$binary" paths > "$temporary/direct-paths.txt"
          "$binary" licenses > "$temporary/direct-licenses.txt"
          "$binary" --smoke

          staged="$temporary/staged/$PACKAGE"
          node scripts/stage-platform-package.mjs \
            --package-dir "npm/$PACKAGE" --binary "$binary" --out "$staged"
          packs="$temporary/packs"
          mkdir "$packs"
          version="$(node -p "require('./package.json').version")"
          pack_json="$(npm pack --ignore-scripts --json --pack-destination "$packs" "$staged")"
          packed="$(node -e '
            const records = JSON.parse(require("fs").readFileSync(0, "utf8"));
            if (!Array.isArray(records) || records.length !== 1 || typeof records[0].filename !== "string") process.exit(1);
            process.stdout.write(records[0].filename);
          ' <<<"$pack_json")"
          platform_tgz="$packs/$PACKAGE-$version.tgz"
          if [[ "$packs/$packed" != "$platform_tgz" ]]; then
            mv -- "$packs/$packed" "$platform_tgz"
          fi
          test -f "$platform_tgz"

          archive_parent="$temporary/archive"
          archive_root="$archive_parent/typerlude-$TARGET"
          mkdir -p "$archive_root"
          cp "$staged/$EXECUTABLE" "$archive_root/$EXECUTABLE"
          cp "$staged/LICENSE" "$staged/THIRD_PARTY_NOTICES.md" \
            "$staged/THIRD_PARTY_LICENSES.html" "$archive_root/"
          cp -R "$staged/licenses" "$archive_root/licenses"
          mkdir "$GITHUB_WORKSPACE/artifacts"
          archive="$GITHUB_WORKSPACE/artifacts/typerlude-$TARGET.tar.gz"
          COPYFILE_DISABLE=1 tar -C "$archive_parent" -czf "$archive" "typerlude-$TARGET"
          python3 - "$archive_root" "$archive" <<'PY'
          import pathlib, sys, tarfile
          root = pathlib.Path(sys.argv[1])
          expected = sorted([root.name, *(str(pathlib.PurePosixPath(root.name, path.relative_to(root))) for path in root.rglob("*"))])
          with tarfile.open(sys.argv[2]) as bundle:
              actual = sorted(member.name.rstrip("/") for member in bundle.getmembers())
          if actual != expected:
              raise SystemExit(f"archive entries differ; expected={expected!r}; actual={actual!r}")
          PY
          extracted="$temporary/extracted"
          mkdir "$extracted"
          COPYFILE_DISABLE=1 tar -C "$extracted" -xzf "$archive"
          extracted_binary="$extracted/typerlude-$TARGET/$EXECUTABLE"
          test -x "$extracted_binary"
          TYPERLUDE_HOME="$temporary/extracted-home" "$extracted_binary" --version
          TYPERLUDE_HOME="$temporary/extracted-home" "$extracted_binary" --smoke
          cp "$platform_tgz" "$GITHUB_WORKSPACE/artifacts/"
          test "$(find "$GITHUB_WORKSPACE/artifacts" -maxdepth 1 -type f | wc -l | tr -d ' ')" = 2
      - name: Smoke, pack, and archive Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
          PACKAGE: ${{ matrix.package }}
          EXECUTABLE: ${{ matrix.executable }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $temporary = Join-Path ([IO.Path]::GetTempPath()) ("typerlude-release-" + [guid]::NewGuid())
          New-Item -ItemType Directory -Path $temporary | Out-Null
          try {
            $binary = Join-Path $env:GITHUB_WORKSPACE "target\$env:TARGET\release\$env:EXECUTABLE"
            $env:TYPERLUDE_HOME = Join-Path $temporary "direct-home"
            $env:TYPERLUDE_NO_UPDATE_CHECK = "1"
            & $binary --version
            & $binary paths | Out-File (Join-Path $temporary "direct-paths.txt") -Encoding utf8
            & $binary licenses | Out-File (Join-Path $temporary "direct-licenses.txt") -Encoding utf8
            & $binary --smoke

            $staged = Join-Path $temporary "staged\$env:PACKAGE"
            node scripts/stage-platform-package.mjs --package-dir "npm\$env:PACKAGE" --binary $binary --out $staged
            $packs = Join-Path $temporary "packs"
            New-Item -ItemType Directory -Path $packs | Out-Null
            $version = node -p "require('./package.json').version"
            $packRecords = @(npm.cmd pack --ignore-scripts --json --pack-destination $packs $staged | ConvertFrom-Json)
            if ($packRecords.Count -ne 1 -or -not ($packRecords[0].filename -is [string])) {
              throw "npm pack did not return one filename"
            }
            $packedTgz = Join-Path $packs $packRecords[0].filename
            $platformTgz = Join-Path $packs "$env:PACKAGE-$version.tgz"
            if ($packedTgz -ne $platformTgz) {
              Move-Item -LiteralPath $packedTgz -Destination $platformTgz
            }
            if (-not (Test-Path -LiteralPath $platformTgz -PathType Leaf)) {
              throw "native npm tarball is missing: $platformTgz"
            }

            $archiveParent = Join-Path $temporary "archive"
            $archiveRoot = Join-Path $archiveParent "typerlude-$env:TARGET"
            New-Item -ItemType Directory -Path $archiveRoot | Out-Null
            Copy-Item (Join-Path $staged $env:EXECUTABLE) $archiveRoot
            Copy-Item (Join-Path $staged "LICENSE") $archiveRoot
            Copy-Item (Join-Path $staged "THIRD_PARTY_NOTICES.md") $archiveRoot
            Copy-Item (Join-Path $staged "THIRD_PARTY_LICENSES.html") $archiveRoot
            Copy-Item (Join-Path $staged "licenses") (Join-Path $archiveRoot "licenses") -Recurse
            $artifacts = Join-Path $env:GITHUB_WORKSPACE "artifacts"
            New-Item -ItemType Directory -Path $artifacts | Out-Null
            $archive = Join-Path $artifacts "typerlude-$env:TARGET.zip"
            Compress-Archive -Path $archiveRoot -DestinationPath $archive

            Add-Type -AssemblyName System.IO.Compression.FileSystem
            $expectedFiles = Get-ChildItem -LiteralPath $archiveRoot -File -Recurse | ForEach-Object {
              (Join-Path (Split-Path $archiveRoot -Leaf) $_.FullName.Substring($archiveRoot.Length + 1)).Replace('\', '/')
            }
            $zip = [IO.Compression.ZipFile]::OpenRead($archive)
            try {
              $actualFiles = $zip.Entries | Where-Object { -not $_.FullName.EndsWith('/') } | ForEach-Object { $_.FullName.TrimEnd('/') }
              $unexpectedDirectories = $zip.Entries | Where-Object { $_.FullName.EndsWith('/') } | ForEach-Object { $_.FullName.TrimEnd('/') } | Where-Object {
                $directory = $_
                -not ($expectedFiles | Where-Object { $_.StartsWith("$directory/") })
              }
              if ($unexpectedDirectories -or (Compare-Object ($expectedFiles | Sort-Object) ($actualFiles | Sort-Object))) {
                throw "zip archive entries differ from the staged closure"
              }
            } finally {
              $zip.Dispose()
            }
            $extracted = Join-Path $temporary "extracted"
            [IO.Compression.ZipFile]::ExtractToDirectory($archive, $extracted)
            $extractedFiles = Get-ChildItem -LiteralPath $extracted -File -Recurse | ForEach-Object {
              $_.FullName.Substring($extracted.Length + 1).Replace('\', '/')
            }
            if (Compare-Object ($expectedFiles | Sort-Object) ($extractedFiles | Sort-Object)) {
              throw "extracted zip closure differs from the staged closure"
            }
            $extractedBinary = Join-Path $extracted "typerlude-$env:TARGET\$env:EXECUTABLE"
            $env:TYPERLUDE_HOME = Join-Path $temporary "extracted-home"
            & $extractedBinary --version
            & $extractedBinary --smoke
            Copy-Item $platformTgz $artifacts
            if ((Get-ChildItem -LiteralPath $artifacts -File).Count -ne 2) {
              throw "artifacts must contain exactly one native tarball and one archive"
            }
          } finally {
            Remove-Item -LiteralPath $temporary -Recurse -Force -ErrorAction SilentlyContinue
          }
      - name: Upload immutable native artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: native-${{ matrix.package }}-${{ matrix.target }}
          path: |
            artifacts/${{ matrix.package }}-*.tgz
            artifacts/typerlude-${{ matrix.target }}.${{ matrix.archive_extension }}
          if-no-files-found: error
          retention-days: 1

  draft:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Pack root npm package
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/check-versions.mjs)"
          npm pack --ignore-scripts --pack-destination dist .
      - name: Verify exact release payload
        shell: bash
        run: |
          set -euo pipefail
          version="$(node scripts/check-versions.mjs)"
          temporary="$(mktemp -d)"
          trap 'rm -rf "$temporary"' EXIT
          expected=(
            "typerlude-aarch64-apple-darwin.tar.gz"
            "typerlude-aarch64-pc-windows-msvc.zip"
            "typerlude-aarch64-unknown-linux-musl.tar.gz"
            "typerlude-darwin-arm64-$version.tgz"
            "typerlude-darwin-x64-$version.tgz"
            "typerlude-linux-arm64-$version.tgz"
            "typerlude-linux-x64-$version.tgz"
            "typerlude-win32-arm64-msvc-$version.tgz"
            "typerlude-win32-x64-msvc-$version.tgz"
            "typerlude-$version.tgz"
            "typerlude-x86_64-apple-darwin.tar.gz"
            "typerlude-x86_64-pc-windows-msvc.zip"
            "typerlude-x86_64-unknown-linux-musl.tar.gz"
          )
          printf '%s\n' "${expected[@]}" | LC_ALL=C sort > "$temporary/expected"
          find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$temporary/actual"
          diff -u "$temporary/expected" "$temporary/actual"

          packages=(
            typerlude-darwin-arm64 typerlude-darwin-x64 typerlude-linux-arm64
            typerlude-linux-x64 typerlude-win32-arm64-msvc typerlude-win32-x64-msvc
          )
          for package in "${packages[@]}"; do
            unpacked="$temporary/npm-$package"
            mkdir "$unpacked"
            tar -C "$unpacked" -xzf "dist/$package-$version.tgz"
            test -z "$(find "$unpacked" -type l -print -quit)"
            cmp "npm/$package/package.json" "$unpacked/package/package.json"
            cmp LICENSE "$unpacked/package/LICENSE"
            cmp THIRD_PARTY_NOTICES.md "$unpacked/package/THIRD_PARTY_NOTICES.md"
            cmp THIRD_PARTY_LICENSES.html "$unpacked/package/THIRD_PARTY_LICENSES.html"
            diff -u \
              <(find assets/licenses -type f -printf '%P\n' | LC_ALL=C sort) \
              <(find "$unpacked/package/licenses" -type f -printf '%P\n' | LC_ALL=C sort)
            while IFS= read -r license; do
              cmp "assets/licenses/$license" "$unpacked/package/licenses/$license"
            done < <(find assets/licenses -type f -printf '%P\n' | LC_ALL=C sort)
            executable=typerlude
            [[ "$package" == typerlude-win32-* ]] && executable=typerlude.exe
            expected_files="$temporary/$package-files"
            {
              printf '%s\n' LICENSE THIRD_PARTY_LICENSES.html THIRD_PARTY_NOTICES.md package.json "$executable"
              find assets/licenses -type f -printf 'licenses/%P\n'
            } | LC_ALL=C sort > "$expected_files"
            diff -u "$expected_files" <(find "$unpacked/package" -type f -printf '%P\n' | LC_ALL=C sort)
            [[ "$package" == typerlude-win32-* ]] || test -x "$unpacked/package/$executable"
          done

          root="$temporary/npm-root"
          mkdir "$root"
          tar -C "$root" -xzf "dist/typerlude-$version.tgz"
          test -z "$(find "$root" -type l -print -quit)"
          cmp package.json "$root/package/package.json"
          cmp bin/typerlude.js "$root/package/bin/typerlude.js"
          cmp README.md "$root/package/README.md"
          cmp README.ko.md "$root/package/README.ko.md"
          for file in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html; do
            cmp "$file" "$root/package/$file"
          done
          diff -u \
            <(find assets/licenses -type f -printf '%P\n' | LC_ALL=C sort) \
            <(find "$root/package/assets/licenses" -type f -printf '%P\n' | LC_ALL=C sort)
          while IFS= read -r license; do
            cmp "assets/licenses/$license" "$root/package/assets/licenses/$license"
          done < <(find assets/licenses -type f -printf '%P\n' | LC_ALL=C sort)
          root_expected="$temporary/root-files"
          {
            printf '%s\n' LICENSE README.ko.md README.md THIRD_PARTY_LICENSES.html THIRD_PARTY_NOTICES.md bin/typerlude.js package.json
            find assets/licenses -type f -printf 'assets/licenses/%P\n'
          } | LC_ALL=C sort > "$root_expected"
          diff -u "$root_expected" <(find "$root/package" -type f -printf '%P\n' | LC_ALL=C sort)
          test -x "$root/package/bin/typerlude.js"

          targets=(
            aarch64-apple-darwin aarch64-unknown-linux-musl x86_64-apple-darwin
            x86_64-unknown-linux-musl aarch64-pc-windows-msvc x86_64-pc-windows-msvc
          )
          for target in "${targets[@]}"; do
            extension=tar.gz
            executable=typerlude
            case "$target" in
              aarch64-apple-darwin) package=typerlude-darwin-arm64 ;;
              x86_64-apple-darwin) package=typerlude-darwin-x64 ;;
              aarch64-unknown-linux-musl) package=typerlude-linux-arm64 ;;
              x86_64-unknown-linux-musl) package=typerlude-linux-x64 ;;
              aarch64-pc-windows-msvc) package=typerlude-win32-arm64-msvc; extension=zip; executable=typerlude.exe ;;
              x86_64-pc-windows-msvc) package=typerlude-win32-x64-msvc; extension=zip; executable=typerlude.exe ;;
            esac
            archive="dist/typerlude-$target.$extension"
            extracted="$temporary/archive-$target"
            mkdir "$extracted"
            if [[ "$extension" == zip ]]; then unzip -q "$archive" -d "$extracted"; else tar -C "$extracted" -xzf "$archive"; fi
            test -z "$(find "$extracted" -type l -print -quit)"
            archive_root="$extracted/typerlude-$target"
            expected_files="$temporary/$target-files"
            {
              printf '%s\n' LICENSE THIRD_PARTY_LICENSES.html THIRD_PARTY_NOTICES.md "$executable"
              find assets/licenses -type f -printf 'licenses/%P\n'
            } | LC_ALL=C sort > "$expected_files"
            diff -u "$expected_files" <(find "$archive_root" -type f -printf '%P\n' | LC_ALL=C sort)
            for file in LICENSE THIRD_PARTY_NOTICES.md THIRD_PARTY_LICENSES.html; do cmp "$file" "$archive_root/$file"; done
            while IFS= read -r license; do cmp "assets/licenses/$license" "$archive_root/licenses/$license"; done \
              < <(find assets/licenses -type f -printf '%P\n' | LC_ALL=C sort)
            cmp "$temporary/npm-$package/package/$executable" "$archive_root/$executable"
            [[ "$extension" == zip ]] || test -x "$archive_root/$executable"
          done

          : > dist/SHA256SUMS
          while IFS= read -r file; do
            (cd dist && sha256sum "$file") >> dist/SHA256SUMS
          done < "$temporary/expected"
          test "$(wc -l < dist/SHA256SUMS | tr -d ' ')" = 13
          (cd dist && sha256sum --check SHA256SUMS)
      - name: Upload exact npm tarballs for publication
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-npm-${{ env.RELEASE_TAG }}
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 1
      - name: Create or update verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          expected="$(mktemp)"
          find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > "$expected"
          test "$(wc -l < "$expected" | tr -d ' ')" = 14
          if is_draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            test "$is_draft" = true || {
              echo "refusing to replace an already published release" >&2
              exit 1
            }
            existing="$(mktemp)"
            gh release view "$RELEASE_TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort > "$existing"
            extras="$(comm -23 "$existing" "$expected")"
            test -z "$extras" || {
              echo "draft release contains unexpected assets" >&2
              printf '%s\n' "$extras" >&2
              exit 1
            }
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --draft --verify-tag --generate-notes --title "Typerlude ${RELEASE_TAG#v}"
          fi
          actual="$(mktemp)"
          gh release view "$RELEASE_TAG" --json isDraft,assets --jq '.isDraft, (.assets[].name)' > "$actual.raw"
          test "$(head -1 "$actual.raw")" = true
          tail -n +2 "$actual.raw" | LC_ALL=C sort > "$actual"
          diff -u "$expected" "$actual"

  publish-cargo:
    needs: draft
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.RELEASE_TAG }}
      - name: Install Rust 1.88.0
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          rustup default 1.88.0
      - name: Verify Cargo package again
        run: |
          cargo package --locked
          cargo publish --dry-run --locked
      - name: Validate registry bootstrap mode
        shell: bash
        env:
          BOOTSTRAP: ${{ vars.TYPERLUDE_REGISTRY_BOOTSTRAP }}
        run: |
          [[ -z "$BOOTSTRAP" || "$BOOTSTRAP" == 1 ]] || {
            echo "TYPERLUDE_REGISTRY_BOOTSTRAP must be empty or 1" >&2
            exit 1
          }
      - name: Preflight registry bootstrap credentials
        if: vars.TYPERLUDE_REGISTRY_BOOTSTRAP == '1'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo "CRATES_TOKEN is required for bootstrap" >&2; exit 1; }
          test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for bootstrap" >&2; exit 1; }
      - name: Check for an identical existing Cargo version
        id: cargo-version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          crate="target/package/typerlude-$version.crate"
          test -f "$crate"
          local_checksum="$(sha256sum "$crate" | awk '{print $1}')"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          status="$(curl --silent --show-error \
            --user-agent "typerlude-release/$RELEASE_TAG" \
            --output "$response" --write-out '%{http_code}' \
            "https://crates.io/api/v1/crates/typerlude/$version")"
          case "$status" in
            200)
              remote_checksum="$(python3 -c \
                'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["version"]["checksum"])' \
                "$response")"
              [[ "$remote_checksum" =~ ^[0-9a-f]{64}$ ]] || {
                echo "crates.io returned a malformed checksum" >&2
                exit 1
              }
              test "$local_checksum" = "$remote_checksum" || {
                echo "crates.io checksum differs for typerlude $version" >&2
                exit 1
              }
              echo "publish=false" >> "$GITHUB_OUTPUT"
              ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "crates.io query failed with HTTP $status" >&2; exit 1 ;;
          esac
      - name: Authenticate with crates.io
        if: steps.cargo-version.outputs.publish == 'true' && vars.TYPERLUDE_REGISTRY_BOOTSTRAP != '1'
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Require OIDC credential
        if: steps.cargo-version.outputs.publish == 'true' && vars.TYPERLUDE_REGISTRY_BOOTSTRAP != '1'
        shell: bash
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: test -n "$CARGO_REGISTRY_TOKEN"
      - name: Publish Cargo with OIDC
        if: steps.cargo-version.outputs.publish == 'true' && vars.TYPERLUDE_REGISTRY_BOOTSTRAP != '1'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
      - name: Publish Cargo bootstrap
        if: steps.cargo-version.outputs.publish == 'true' && vars.TYPERLUDE_REGISTRY_BOOTSTRAP == '1'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_TOKEN }}

  publish-npm:
    needs: publish-cargo
    runs-on: ubuntu-24.04
    environment: release
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || env.RELEASE_TAG }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          package-manager-cache: false
          registry-url: https://registry.npmjs.org
      - name: Install npm 11.5.1
        run: |
          npm install --global npm@11.5.1
          test "$(node --version)" = v22.14.0
          test "$(npm --version)" = 11.5.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-npm-${{ env.RELEASE_TAG }}
          path: dist
      - name: Validate registry bootstrap mode and exact npm payload
        shell: bash
        env:
          BOOTSTRAP: ${{ vars.TYPERLUDE_REGISTRY_BOOTSTRAP }}
        run: |
          set -euo pipefail
          [[ -z "$BOOTSTRAP" || "$BOOTSTRAP" == 1 ]] || {
            echo "TYPERLUDE_REGISTRY_BOOTSTRAP must be empty or 1" >&2
            exit 1
          }
          version="${RELEASE_TAG#v}"
          expected="$(mktemp)"
          printf '%s\n' \
            "typerlude-darwin-arm64-$version.tgz" "typerlude-darwin-x64-$version.tgz" \
            "typerlude-linux-arm64-$version.tgz" "typerlude-linux-x64-$version.tgz" \
            "typerlude-win32-arm64-msvc-$version.tgz" "typerlude-win32-x64-msvc-$version.tgz" \
            "typerlude-$version.tgz" | LC_ALL=C sort > "$expected"
          diff -u "$expected" <(find dist -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
      - name: Preflight npm bootstrap credential
        if: vars.TYPERLUDE_REGISTRY_BOOTSTRAP == '1'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: test -n "$NODE_AUTH_TOKEN" || { echo "NPM_TOKEN is required for bootstrap" >&2; exit 1; }
      - name: Dry-run every npm package before publication
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          packages=(
            typerlude-darwin-arm64 typerlude-darwin-x64 typerlude-linux-arm64
            typerlude-linux-x64 typerlude-win32-arm64-msvc typerlude-win32-x64-msvc typerlude
          )
          for package in "${packages[@]}"; do
            npm publish --dry-run --ignore-scripts "./dist/$package-$version.tgz"
          done
      - name: Publish npm bootstrap, native packages first
        if: vars.TYPERLUDE_REGISTRY_BOOTSTRAP == '1'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          node scripts/publish-npm-packages.mjs "$version" --provenance
      - name: Publish npm with OIDC, native packages first
        if: vars.TYPERLUDE_REGISTRY_BOOTSTRAP != '1'
        shell: bash
        run: |
          set -euo pipefail
          test -z "${NODE_AUTH_TOKEN:-}" || { echo "NODE_AUTH_TOKEN is forbidden for OIDC publication" >&2; exit 1; }
          version="${RELEASE_TAG#v}"
          node scripts/publish-npm-packages.mjs "$version"

  publish-release:
    needs: publish-npm
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Publish verified GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true || {
            echo "release is missing or is no longer a draft" >&2
            exit 1
          }
          gh release edit "$RELEASE_TAG" --draft=false --latest
