[package]
name = "typeul"
version = "1.0.0"
edition = "2024"
rust-version = "1.88"
description = "Offline-first Korean and English terminal typing tutor"
readme = "README.md"
license-file = "LICENSE"
repository = "https://github.com/baba9811/typeul"
homepage = "https://github.com/baba9811/typeul"
keywords = ["typing", "korean", "terminal", "tui", "ratatui"]
categories = ["command-line-utilities"]
include = [
  "/src/**", "/assets/**", "/Cargo.lock", "/LICENSE", "/README.md",
  "/THIRD_PARTY_NOTICES.md"
]

[dependencies]
anyhow = "1.0.104"
atomic-write-file = "0.3.0"
crossterm = "0.29.0"
directories = "6.0.0"
fastrand = "2.5.0"
include_dir = "0.7.4"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
time = { version = "0.3.55", features = ["formatting", "local-offset", "macros", "serde"] }
toml = "1.1.4"
unicode-normalization = "0.1.25"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
